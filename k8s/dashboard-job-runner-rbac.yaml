apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-job-runner
  namespace: capstone
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dashboard-simulator-job-manager
  namespace: capstone
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-simulator-job-manager
  namespace: capstone
subjects:
  - kind: ServiceAccount
    name: dashboard-job-runner
    namespace: capstone
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dashboard-simulator-job-manager

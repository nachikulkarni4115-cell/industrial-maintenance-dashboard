# One-time / re-runnable initialization Job.
# Creates tables and seeds synthetic demo data if not already present.
# Does NOT delete existing data. Does NOT reset existing admin passwords.
#
# Permission strategy: runAsGroup/fsGroup 10001 matches the existing PVC
# host directory (GID 10001, mode 0770) so SQLite can write /data/maintenance.db.
#
# Usage (after Secret exists and image is available):
#   kubectl -n capstone apply -f k8s/init-job.yaml
#   kubectl -n capstone logs job/maintenance-dashboard-init -f
#   kubectl -n capstone delete job maintenance-dashboard-init
#
# Do NOT apply k8s/pvc.yaml — the bound PVC maintenance-dashboard-data already exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: maintenance-dashboard-init
  namespace: capstone
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: init
          image: nachiket1/industrial-maintenance-dashboard:latest
          imagePullPolicy: Always
          command: ["sh", "-c"]
          args:
            - |
              set -e
              export FLASK_APP=wsgi:app
              echo "Running init-db..."
              flask init-db
              echo "Running seed-demo (idempotent)..."
              flask seed-demo
              echo "Running create-admin (create only if missing)..."
              flask create-admin
              echo "Initialization complete."
          env:
            - name: FLASK_CONFIG
              value: "production"
            - name: DATABASE_URL
              value: "sqlite:////data/maintenance.db"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: maintenance-dashboard-secrets
                  key: SECRET_KEY
            - name: INGESTION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: maintenance-dashboard-secrets
                  key: INGESTION_TOKEN
            - name: BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: maintenance-dashboard-secrets
                  key: BOOTSTRAP_ADMIN_USERNAME
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maintenance-dashboard-secrets
                  key: BOOTSTRAP_ADMIN_PASSWORD
            - name: BOOTSTRAP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: maintenance-dashboard-secrets
                  key: BOOTSTRAP_ADMIN_EMAIL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: maintenance-dashboard-data
